  .r1{width:260px;top:-30px;left:-70px;transform:rotate(-15deg)}
  .r2{width:300px;bottom:-40px;right:-80px;transform:rotate(14deg)}
  .r3{width:150px;top:44%;left:58%;transform:rotate(-6deg);opacity:.06!important}
  .wrap{position:relative;z-index:1;width:100%;max-width:420px;text-align:center}
  .logo{width:120px;height:120px;border-radius:50%;margin:0 auto 14px;background:#fff;
        border:4px solid var(--verde);box-shadow:0 10px 28px rgba(90,168,70,.30);overflow:hidden}
  .logo img{width:100%;height:100%;object-fit:cover}
  h1{font-size:28px;font-weight:800;letter-spacing:1px;color:var(--verde-osc)}
  .sub{color:var(--gris);font-size:14px;margin:4px 0 26px}
  .btn{display:flex;align-items:center;gap:14px;width:100%;padding:13px 16px;margin-bottom:12px;
       border-radius:16px;text-decoration:none;color:var(--texto);font-weight:600;font-size:17px;
       background:rgba(255,255,255,.92);border:2px solid var(--borde);
       box-shadow:0 4px 14px rgba(0,0,0,.06);transition:transform .15s,border-color .15s,box-shadow .15s}
  .btn:hover{transform:translateY(-2px);border-color:var(--verde);box-shadow:0 8px 20px rgba(90,168,70,.20)}
  .btn:active{transform:scale(.97)}
  .ico{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .ico svg{width:26px;height:26px;fill:#fff}
  .btn span{flex:1;text-align:left}
  .btn .arrow{color:var(--verde);font-size:24px;line-height:1}
  .ig .ico{background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af,#515bd4)}
  .fb .ico{background:#1877f2}
  .wa .ico{background:#25d366}

const CONFIG = {
  instagram: "https://www.instagram.com/sharewow_chile/",
  facebook:  "https://www.facebook.com/share/1DewfVcQo7/",
  whatsapp:  "56966870705",
  mensajeWsp:"Hola Sharewow, vengo del QR 👋",
  tiktok:    "https://www.tiktok.com/@sharewowchile"
};
/* ========================================= */
document.getElementById('lnk-ig').href = CONFIG.instagram;
document.getElementById('lnk-fb').href = CONFIG.facebook;
document.getElementById('lnk-wa').href = "https://wa.me/" + CONFIG.whatsapp +
  (CONFIG.mensajeWsp ? "?text=" + encodeURIComponent(CONFIG.mensajeWsp) : "");
document.getElementById('lnk-tt').href = CONFIG.tiktok;

/* Modo QR: abre la página con ?qr al final */
if (location.search.includes('qr')) {
  document.getElementById('links').style.display = 'none';
  document.getElementById('foot').style.display = 'none';
  document.getElementById('qrbox').style.display = 'block';
  new QRCode(document.getElementById('qr'), { text: location.origin + location.pathname,
    width:280, height:280, colorDark:'#000000', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.H });
}
function bajarQR(){
  const c = document.querySelector('#qr canvas'); if(!c) return;
  const S=1400, big=document.createElement('canvas'); big.width=big.height=S;
  const g=big.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,S,S);
  g.imageSmoothingEnabled=false; g.drawImage(c,70,70,S-140,S-140);
  // logo al centro del QR
  const L=document.getElementById('logoimg'), ls=S*0.22, lx=(S-ls)/2;
  g.fillStyle='#fff'; g.beginPath(); g.arc(S/2,S/2,ls/2+18,0,Math.PI*2); g.fill();
  g.save(); g.beginPath(); g.arc(S/2,S/2,ls/2,0,Math.PI*2); g.clip(); g.drawImage(L,lx,lx,ls,ls); g.restore();
  g.strokeStyle='#5aa846'; g.lineWidth=8; g.beginPath(); g.arc(S/2,S/2,ls/2,0,Math.PI*2); g.stroke();
  const a=document.createElement('a'); a.download='QR-Sharewow.png'; a.href=big.toDataURL('image/png'); a.click();
}
</script>
